<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="wallBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="doorInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Baseline (from baseline() in house.c) -->
  <line x1="45" y1="212" x2="211" y2="212" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <line x1="60" y1="220" x2="196" y2="220" stroke="#6366F1" stroke-width="3" stroke-linecap="round" />

  <!-- House Body Walls (from mid() in house.c) -->
  <rect x="55" y="115" width="146" height="93" rx="8" fill="#1E293B" stroke="url(#wallBorderGrad)" stroke-width="4.5" />

  <!-- Roof Gable Fill (from roof() in house.c) -->
  <polygon points="128,40 48,120 208,120" fill="#1E293B" />

  <!-- Roof Trim Lines -->
  <polyline points="37,120 128,40 219,120" fill="none" stroke="url(#roofGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  <polyline points="47,117 128,46 209,117" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Windows (from windows() in house.c) -->
  <!-- Left Window -->
  <rect x="54" y="108" width="44" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" />
  <line x1="76" y1="109" x2="76" y2="151" stroke="#F59E0B" stroke-width="2" />
  <line x1="55" y1="130" x2="97" y2="130" stroke="#F59E0B" stroke-width="2" />

  <!-- Right Window -->
  <rect x="154" y="108" width="44" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" />
  <line x1="176" y1="109" x2="176" y2="151" stroke="#F59E0B" stroke-width="2" />
  <line x1="155" y1="130" x2="197" y2="130" stroke="#F59E0B" stroke-width="2" />

  <!-- Door (from doors() in house.c) -->
  <rect x="105" y="149" width="46" height="58" rx="6" fill="url(#doorInnerGrad)" stroke="#38BDF8" stroke-width="3.5" />
  <circle cx="138" cy="180" r="3.2" fill="#FBBF24" />

  <!-- Asterisk Stars (Signature C Output element) -->
  <!-- Spire Star at Apex -->
  <g transform="translate(128, 34)" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="-9" x2="0" y2="9" />
    <line x1="-9" y1="0" x2="9" y2="0" />
    <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5" />
    <line x1="-6.5" y1="6.5" x2="6.5" y2="-6.5" />
    <circle cx="0" cy="0" r="2.2" fill="#FBBF24" stroke="none" />
  </g>

  <!-- Attic Vent Star -->
  <g transform="translate(128, 93)" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-6.5" x2="0" y2="6.5" />
    <line x1="-6.5" y1="0" x2="6.5" y2="0" />
    <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" />
    <line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5" />
    <circle cx="0" cy="0" r="1.5" fill="#38BDF8" stroke="none" />
  </g>

  <!-- Celestial Asterisk Accents -->
  <g transform="translate(70, 64)" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-5" x2="0" y2="5" />
    <line x1="-5" y1="0" x2="5" y2="0" />
    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" />
    <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" />
  </g>

  <g transform="translate(186, 64)" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-5" x2="0" y2="5" />
    <line x1="-5" y1="0" x2="5" y2="0" />
    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" />
    <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" />
  </g>

  <g transform="translate(46, 88)" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="-4" x2="0" y2="4" />
    <line x1="-4" y1="0" x2="4" y2="0" />
    <line x1="-3" y1="-3" x2="3" y2="3" />
    <line x1="-3" y1="3.5" x2="3" y2="-3.5" />
  </g>

  <g transform="translate(210, 88)" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="-4" x2="0" y2="4" />
    <line x1="-4" y1="0" x2="4" y2="0" />
    <line x1="-3" y1="-3" x2="3" y2="3" />
    <line x1="-3" y1="3.5" x2="3" y2="-3.5" />
  </g>
</svg>
